limit_req_zone $binary_remote_addr zone=novel_auth_login:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=novel_auth_passkey_options:10m rate=6r/m;
limit_req_status 429;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  access_log off;

  # Trust only the measured host-edge bridge peer, substituted at image build
  # (default 172.30.19.1/32). Any other peer keeps its real address and cannot
  # influence the client IP reported to the application.
  set_real_ip_from __STAGING_REAL_IP_PEER__;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  root /usr/share/nginx/html;
  index index.html;

  # Replaced at image build with MAX_UPLOAD_BYTES plus 1 MiB of multipart framing.
  client_max_body_size __MAX_UPLOAD_BODY_BYTES__;
  error_page 413 = @upload_too_large;
  error_page 429 = @rate_limited;

  location @upload_too_large {
    default_type application/json;
    return 413 '{"error":{"code":"upload_too_large","message":"上传文件超过允许的大小。","details":{}}}';
  }

  location @rate_limited {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "30" always;
    return 429 '{"error":{"code":"auth_entry_rate_limited","message":"请求过于频繁，请稍后再试。","details":{}}}';
  }

  client_body_timeout 120s;
  keepalive_timeout 30s;
  send_timeout 30s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'" always;

  location = /healthz {
    proxy_pass http://server:8000/api/v1/health/ready;
    include /etc/nginx/snippets/staging-upstream-headers.conf;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'" always;
  }

  location = /api/v1/auth/login {
    limit_req zone=novel_auth_login burst=6 nodelay;
    include /etc/nginx/snippets/staging-api-proxy.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'" always;
  }

  location = /api/v1/auth/passkeys/authentication/options {
    limit_req zone=novel_auth_passkey_options burst=3 nodelay;
    include /etc/nginx/snippets/staging-api-proxy.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'" always;
  }

  location /api/ {
    include /etc/nginx/snippets/staging-api-proxy.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'" always;
  }

  location = /openapi.json {
    return 404;
  }

  location = /docs {
    return 404;
  }

  location = /docs/ {
    return 404;
  }

  location = /redoc {
    return 404;
  }

  location = /redoc/ {
    return 404;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
