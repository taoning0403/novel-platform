server {
  listen 80;
  server_name _;
  access_log off;

  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  root /usr/share/nginx/html;
  index index.html;
  # Replaced at image build with MAX_UPLOAD_BYTES plus 1 MiB of multipart framing.
  client_max_body_size __MAX_UPLOAD_BODY_BYTES__;
  error_page 413 = @upload_too_large;

  location @upload_too_large {
    default_type application/json;
    return 413 '{"error":{"code":"upload_too_large","message":"上传文件超过允许的大小。","details":{}}}';
  }

  location /api/ {
    proxy_pass http://server:8000;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
