name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: novel_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d novel_platform_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/server
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/novel_platform_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/novel_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/server
      - run: pnpm verify -- --quality-only --all
      - run: pnpm verify -- --config-only
      - run: pnpm api:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  acceptance:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/server
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm acceptance
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-v050
          path: artifacts/acceptance-v050*
