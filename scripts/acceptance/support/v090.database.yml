services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: novel_platform
      POSTGRES_USER: novel_platform
      POSTGRES_PASSWORD: novel_platform_acceptance
    ports:
      - "127.0.0.1:${V090_POSTGRES_PORT:?V090_POSTGRES_PORT is required}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel_platform -d novel_platform"]
      interval: 2s
      timeout: 2s
      retries: 40
    tmpfs:
      - /var/lib/postgresql/data
