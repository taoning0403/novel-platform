x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

x-server-environment: &server-environment
  DATABASE_URL: "postgresql+psycopg://novel_platform:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/novel_platform"
  ENVIRONMENT: "${ENVIRONMENT:-staging}"
  CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS is required}"
  TRUSTED_HOSTS: "${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}"
  LOG_LEVEL: "WARNING"
  AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
  AUTH_HASH_SECRET: "${AUTH_HASH_SECRET:?AUTH_HASH_SECRET is required}"
  AUTH_CREDENTIAL_HASH_SECRET: "${AUTH_CREDENTIAL_HASH_SECRET:?AUTH_CREDENTIAL_HASH_SECRET is required}"
  AUTH_ACCESS_TOKEN_TTL_SECONDS: "900"
  AUTH_REFRESH_TOKEN_TTL_DAYS: "30"
  AUTH_COOKIE_NAME: "novel_refresh"
  AUTH_DEVICE_COOKIE_NAME: "novel_device"
  AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
  AUTH_COOKIE_SAMESITE: "${AUTH_COOKIE_SAMESITE:-strict}"
  AUTH_COOKIE_DOMAIN: ""
  AUTH_ISSUER: "novel-platform-v080-acceptance"
  AUTH_AUDIENCE: "novel-platform-v080-acceptance-client"
  AUTH_LOGIN_MAX_FAILURES: "5"
  AUTH_LOGIN_WINDOW_SECONDS: "600"
  AUTH_LOGIN_BLOCK_SECONDS: "900"
  ADMIN_RECOVERY_TTL_MINUTES: "15"
  WEBAUTHN_RP_ID: "localhost"
  WEBAUTHN_RP_NAME: "个人数字阅读与藏书整理"
  WEBAUTHN_ORIGINS: "${WEBAUTHN_ORIGINS:?WEBAUTHN_ORIGINS is required}"
  WEBAUTHN_CHALLENGE_TTL_SECONDS: "300"
  OPENAPI_ENABLED: "false"
  TRUST_PROXY_HEADERS: "true"
  LIBRARY_STORAGE_ROOT: "/data/library"
  MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-1048576}"

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: "novel_platform"
      POSTGRES_USER: "novel_platform"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    networks:
      database:
        ipv4_address: 10.208.10.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel_platform -d novel_platform"]
      interval: 3s
      timeout: 3s
      retries: 40
    shm_size: 64m
    logging: *default-logging

  migrate:
    build:
      context: ../../../apps/server
    environment: *server-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    networks:
      database:
        ipv4_address: 10.208.10.20
    restart: "no"
    logging: *default-logging

  server:
    build:
      context: ../../../apps/server
    environment: *server-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - uvicorn
      - novel_platform.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --no-access-log
    networks:
      proxy:
        ipv4_address: 10.208.9.20
      database:
        ipv4_address: 10.208.10.30
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40
    logging: *default-logging

  web:
    build:
      context: ../../..
      dockerfile: apps/web/Dockerfile.staging
      args:
        MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-1048576}"
        STAGING_REAL_IP_PEER: "${STAGING_REAL_IP_PEER:-10.208.8.2}"
    depends_on:
      server:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 10.208.8.10
      proxy:
        ipv4_address: 10.208.9.10
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
    logging: *default-logging

  edge:
    image: nginx:1.27.5-alpine
    volumes:
      - ./v080-edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EDGE_PORT:?EDGE_PORT is required}:8080"
    networks:
      edge:
        ipv4_address: 10.208.8.2
    logging: *default-logging

  client:
    image: curlimages/curl:8.10.1
    command: ["sleep", "infinity"]
    depends_on:
      edge:
        condition: service_started
    networks:
      edge:
        ipv4_address: 10.208.8.3
    logging: *default-logging

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 10.208.8.0/24
  proxy:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.208.9.0/24
  database:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.208.10.0/24
